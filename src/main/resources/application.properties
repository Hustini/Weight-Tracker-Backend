spring.application.name=WeightTracker

# ===============================
# DATABASE CONFIG (PostgreSQL)
# ===============================

# Use environment variables with safe defaults
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:WeightTracker}
spring.datasource.username=${DB_USER:hustini}
spring.datasource.password=${DB_PASSWORD:password}

spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================

# Updates schema without deleting data
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in logs (good for development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect (optional but recommended)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# SERVER CONFIG
# ===============================

# Allow access from outside container
server.address=0.0.0.0
server.port=8080

# Connection to the .env fil
spring.config.import=optional:file:.env[.properties]