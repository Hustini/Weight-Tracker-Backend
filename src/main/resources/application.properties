spring.application.name=WeightTracker

# JDBC URL to connect to PostgreSQL database named 'amigos'
# localhost:5332 - Host and port (5332 is mapped to container's 5432)
spring.datasource.url=jdbc:postgresql://localhost:5332/WeightTracker

# Database username (matches POSTGRES_USER in docker-compose.yml)
spring.datasource.username=hustini

# Database password (matches POSTGRES_PASSWORD in docker-compose.yml)
spring.datasource.password=password

# Fully qualified class name of the PostgreSQL JDBC driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate schema generation strategy
# 'create-drop' means Hibernate will create all tables on startup and drop them on shutdown
spring.jpa.hibernate.ddl-auto=create-drop

# Enables formatting of SQL statements in the console for better readability
spring.jpa.properties.hibernate.format_sql=true

# Logs the generated SQL statements to the console
spring.jpa.show-sql=true

spring.config.import=optional:file:.env[.properties]