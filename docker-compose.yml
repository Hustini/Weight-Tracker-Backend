services:
  # -------------------------
  # PostgreSQL Database Service
  # -------------------------
  db:
    container_name: WeightTrackerDB
    image: postgres:latest

    environment:
      # Username for the PostgreSQL superuser
      POSTGRES_USER: hustini

      # Password for the PostgreSQL superuser
      POSTGRES_PASSWORD: password

      POSTGRES_DB: WeightTracker

      # Path inside the container where PostgreSQL will store its data
      PGDATA: /data/postgres

    volumes:
      # Mount a named volume to persist database data
      - db:/data/postgres

    ports:
      # Map port 5432 in the container to 5332 on the host
      - "5332:5432"

    networks:
      - db

    restart: unless-stopped


  # -------------------------
  # Application Service
  # -------------------------
  app:
    container_name: WeightTrackerApp

    # Build your app from a Dockerfile in the current directory
    build: .
    image: ghcr.io/hustini/weighttracker:latest

    # Map your app port
    ports:
      - "8080:8080"

    # Ensure DB starts first
    depends_on:
      - db

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: WeightTracker
      DB_USER: hustini
      DB_PASSWORD: password

    networks:
      - db

    # Automatically restart the container unless explicitly stopped
    restart: unless-stopped


# -------------------------
# Networks
# -------------------------
networks:
  db:
    driver: bridge


# -------------------------
# Volumes
# -------------------------
volumes:
  db:

# "docker compose up -d --build" to build and start the container (DB + Backend)
# "mvn clean package -DskipTests" to rebuild maven
# "docker compose down" to stop and remove the container