services:
  # -------------------------
  # PostgreSQL Database Service
  # -------------------------
  db:
    container_name: ${DB_CONTAINER_NAME:-WeightTrackerDB}
    image: postgres:latest
    platform: ${PLATFORM:-linux/amd64}

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: ${PGDATA:-/data/postgres}

    volumes:
      - db:${PGDATA:-/data/postgres}

    ports:
      - "${DB_HOST_PORT:-5332}:5432"

    networks:
      - db

    restart: unless-stopped


  # -------------------------
  # Application Service
  # -------------------------
  app:
    container_name: ${APP_CONTAINER_NAME:-WeightTrackerApp}
    build: .
    image: ${APP_IMAGE:-ghcr.io/hustini/weighttracker:latest}
    platform: ${PLATFORM:-linux/amd64}

    # Map your app port
    ports:
      - "${APP_PORT:-8080}:8080"

    # Ensure DB starts first
    depends_on:
      - db

    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECURITY_JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APP_USER_USERNAME: ${APP_USER_USERNAME}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}

    networks:
      - db

    # Automatically restart the container unless explicitly stopped
    restart: unless-stopped


# -------------------------
# Networks
# -------------------------
networks:
  db:
    driver: bridge


# -------------------------
# Volumes
# -------------------------
volumes:
  db:

# "docker compose up -d --build" to build and start the container (DB + Backend)
# "mvn clean package -DskipTests" to rebuild maven
# "docker compose down" to stop and remove the container